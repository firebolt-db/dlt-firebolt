name: Release new version

on:
  workflow_dispatch:
    inputs:
      pre-release-tag:
        required: false
        description: "Tag for pre-release (optional)"
      major-release:
        required: false
        description: "Trigger a major release (optional). Leave empty for regular release."
      version-override:
        required: false
        description: "Override auto-generated version tag (useful for first release in a new repo)."

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_FB_DB_CI_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_FB_DB_CI_WRITER_APP_KEY_PEM }}
          permission-contents: write

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # The release step pushes the version bump and tag.
          persist-credentials: true

      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q -m "not integration"

      - name: Publish action
        uses: firebolt-db/action-python-release@4df4861ff745d6e2bbc602b2e8d6578d4f8dcf61 # v1.0.0
        with:
          pre-release-tag: ${{ inputs.pre-release-tag }}
          major-release: ${{ inputs.major-release }}
          pypi-username: ${{ secrets.PYPI_USERNAME }}
          pypi-password: ${{ secrets.PYPI_PASSWORD }}
          version-file-path: "firebolt_dest/__init__.py"
          version-override: ${{ inputs.version-override }}
